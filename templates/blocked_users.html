<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blocked Users - PrivateConnect</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .header {
            background: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .back-button {
            text-decoration: none;
            font-size: 24px;
            color: #111827;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .user-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-picture {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            background: #e5e7eb;
        }

        .default-picture {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
        }

        .name {
            font-size: 17px;
            font-weight: bold;
        }

        .blocked-text {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .empty {
            background: white;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .empty h3 {
            margin: 5px 0;
        }

        .empty p {
            color: #6b7280;
        }

        .unblock-button {
            border: none;
            background: #ef4444;
            color: white;

            padding: 9px 14px;
            border-radius: 8px;

            cursor: pointer;
            font-size: 14px;
        }

        .unblock-button:hover {
            opacity: 0.9;
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <a
            href="{{ url_for('settings') }}"
            class="back-button"
        >
            ←
        </a>

        <h2>
            Blocked Users
        </h2>

    </div>


    <!-- CONTENT -->

    <div class="container">

        {% if blocked %}

            {% for user in blocked %}

                <div class="user-card">

                    <div class="user-info">

                        {% if user['profile_picture'] %}

                            <img
                                src="{{ url_for(
                                    'static',
                                    filename='uploads/' + user['profile_picture']
                                ) }}"
                                class="profile-picture"
                            >

                        {% else %}

                            <div class="default-picture">
                                👤
                            </div>

                        {% endif %}


                        <div>

                            <div class="name">
                                {{ user['name'] }}
                            </div>

                            <div class="blocked-text">
                                This user is blocked
                            </div>

                        </div>

                    </div>


                    <form
                        action="{{ url_for(
                            'unblock_user',
                            user_id=user['blocked_id']
                        ) }}"
                        method="POST"
                    >

                        <button
                            type="submit"
                            class="unblock-button"
                            onclick="return confirm('Unblock this user?');"
                        >
                            Unblock
                        </button>

                    </form>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty">

                <div class="empty-icon">
                    🚫
                </div>

                <h3>
                    No Blocked Users
                </h3>

                <p>
                    You have not blocked anyone yet.
                </p>

            </div>

        {% endif %}

    </div>

</body>
</html>
