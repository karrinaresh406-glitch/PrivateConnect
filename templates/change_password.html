<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Change Password - PrivateConnect</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

.container {
    max-width: 500px;
    margin: 40px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 25px;
    margin-bottom: 8px;
}

.header p {
    color: #777;
    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 14px;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

.form-group input:focus {
    border-color: #2878ff;
}

.change-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #2878ff;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.change-button:hover {
    background: #1769e8;
}

.back-button {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #2878ff;
    text-decoration: none;
    font-size: 14px;
}

.error {
    background: #fff0f0;
    color: #d92d20;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    text-align: center;
    font-size: 14px;
}

.success {
    background: #e9f8ed;
    color: #237a2c;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 18px;
    text-align: center;
    font-size: 14px;
}

.password-info {
    margin-top: 20px;
    padding: 14px;
    background: #f7f8fa;
    border-radius: 10px;
}

.password-info p {
    font-size: 13px;
    color: #666;
    margin-bottom: 5px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <h1>🔐 Change Password</h1>

            <p>
                Keep your PrivateConnect account secure
            </p>

        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="success">
            {{ success }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('change_password') }}"
        >

            <div class="form-group">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="change-button"
            >
                Change Password
            </button>

        </form>


        <div class="password-info">

            <p>🔒 Password must contain at least 6 characters.</p>

            <p>🔒 Never share your password with anyone.</p>

        </div>


        <a
            href="{{ url_for('settings') }}"
            class="back-button"
        >
            ← Back to Settings
        </a>

    </div>

</div>

</body>

</html>
