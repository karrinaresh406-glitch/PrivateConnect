<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Connections - PrivateConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .person {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .profile-picture {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
        }

        .default-picture {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .info {
            flex: 1;
        }

        .name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .email {
            color: #666;
            font-size: 14px;
        }

        .message-button {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 12px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #333;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>👥 My Connections</h1>

    {% if people %}

        {% for person in people %}

        <div class="person">

            {% if person["profile_picture"] %}

                <img
                    src="{{ url_for('static', filename='uploads/' + person['profile_picture']) }}"
                    class="profile-picture"
                    alt="Profile Picture"
                >

            {% else %}

                <div class="default-picture">
                    👤
                </div>

            {% endif %}


            <div class="info">

                <div class="name">
                    {{ person["name"] }}
                </div>

                <div class="email">
                    {{ person["email"] }}
                </div>

                <a
                    href="{{ url_for('conversation', user_id=person['id']) }}"
                    class="message-button"
                >
                    💬 Message
                </a>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            You don't have any connections yet.
        </div>

    {% endif %}


    <a
        href="{{ url_for('find_people') }}"
        class="back"
    >
        ← Find People
    </a>

</div>

</body>

</html>
