<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Chat - PrivateConnect</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0b141a;
            color: white;
        }

        /* =====================================================
           MAIN CHAT
        ===================================================== */

        .chat-app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(38, 78, 98, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(18, 64, 85, 0.18),
                    transparent 35%
                ),
                #0b141a;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .chat-header {
            height: 62px;
            min-height: 62px;

            display: flex;
            align-items: center;

            padding: 0 14px;

            background: #202c33;

            border-bottom: 1px solid rgba(255,255,255,0.04);

            z-index: 10;
        }

        .back-btn {
            width: 38px;
            height: 38px;

            border: none;
            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 4px;
        }

        .profile-photo {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            object-fit: cover;

            background: #3b4a54;

            margin-right: 10px;
        }

        .default-avatar {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: #52606a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: bold;

            margin-right: 10px;
        }

        .user-info {
            flex: 1;

            min-width: 0;
        }

        .user-name {
            font-size: 16px;
            font-weight: 500;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .online-status {
            margin-top: 3px;

            font-size: 12px;

            color: #aebac1;
        }

        .online-status.online {
            color: #53bdeb;
        }

        /* =====================================================
           MESSAGES AREA
        ===================================================== */

        .messages-area {
            flex: 1;

            overflow-y: auto;

            padding: 16px 5% 18px 5%;

            display: flex;
            flex-direction: column;

            scroll-behavior: smooth;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(255,255,255,0.025),
                    transparent 20%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(255,255,255,0.02),
                    transparent 25%
                ),
                #0b141a;
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: #37474f;
            border-radius: 10px;
        }

        /* =====================================================
           MESSAGE ROW
        ===================================================== */

        .message-row {
            width: 100%;

            display: flex;

            margin: 2px 0;
        }

        .message-row.sent {
            justify-content: flex-end;
        }

        .message-row.received {
            justify-content: flex-start;
        }

        /* =====================================================
           WHATSAPP STYLE BUBBLE
        ===================================================== */

        .message-bubble {
            position: relative;

            max-width: min(72%, 520px);

            padding: 7px 9px 5px 9px;

            border-radius: 8px;

            word-wrap: break-word;
            overflow-wrap: anywhere;

            box-shadow: 0 1px 1px rgba(0,0,0,0.25);

            font-size: 14px;

            line-height: 1.4;
        }

        .sent .message-bubble {
            background: #005c4b;

            border-top-right-radius: 3px;
        }

        .received .message-bubble {
            background: #202c33;

            border-top-left-radius: 3px;
        }

        /* =====================================================
           TEXT
        ===================================================== */

        .message-text {
            white-space: pre-wrap;

            padding-right: 48px;

            min-height: 18px;
        }

        /* =====================================================
           IMAGE
        ===================================================== */

        .message-image {
            display: block;

            max-width: 280px;
            max-height: 320px;

            width: auto;
            height: auto;

            object-fit: cover;

            border-radius: 6px;

            margin: 1px 0 4px 0;

            cursor: pointer;
        }

        /*
           If message contains only image,
           remove unnecessary spacing.
        */

        .image-only {
            padding: 4px 4px 4px 4px;
        }

        .image-only .message-image {
            margin: 0;
        }

        /* =====================================================
           MESSAGE FOOTER
        ===================================================== */

        .message-footer {
            float: right;

            display: flex;
            align-items: center;

            gap: 3px;

            margin-left: 8px;
            margin-top: 3px;

            height: 14px;
        }

        .message-time {
            font-size: 10px;

            color: #aebac1;

            white-space: nowrap;
        }

        .ticks {
            font-size: 13px;

            color: #8696a0;

            line-height: 1;
        }

        .ticks.seen {
            color: #53bdeb;
        }

        /* =====================================================
           UNSEND BUTTON
        ===================================================== */

        .unsend-btn {
            position: absolute;

            top: -29px;
            right: 0;

            border: none;

            background: #202c33;

            color: #e9edef;

            padding: 6px 9px;

            border-radius: 6px;

            font-size: 11px;

            cursor: pointer;

            display: none;

            z-index: 20;

            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .message-bubble:hover .unsend-btn {
            display: block;
        }

        .unsend-btn:hover {
            background: #31404a;
        }

        /* =====================================================
           EMPTY CHAT
        ===================================================== */

        .empty-chat {
            flex: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #8696a0;

            font-size: 14px;

            text-align: center;
        }

        /* =====================================================
           IMAGE PREVIEW
        ===================================================== */

        .image-preview-container {
            display: none;

            padding: 8px 14px;

            background: #202c33;

            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .preview-wrapper {
            position: relative;

            width: 70px;
            height: 70px;
        }

        #imagePreview {
            width: 70px;
            height: 70px;

            object-fit: cover;

            border-radius: 8px;
        }

        .remove-preview {
            position: absolute;

            top: -7px;
            right: -7px;

            width: 22px;
            height: 22px;

            border: none;

            border-radius: 50%;

            background: #ef5350;

            color: white;

            cursor: pointer;

            font-size: 14px;
        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer {
            min-height: 62px;

            display: flex;
            align-items: flex-end;

            gap: 7px;

            padding: 8px 10px;

            background: #202c33;

            border-top: 1px solid rgba(255,255,255,0.03);
        }

        .attach-btn {
            flex-shrink: 0;

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background: transparent;

            color: #aebac1;

            font-size: 22px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        #imageInput {
            display: none;
        }

        .input-container {
            flex: 1;

            min-height: 42px;

            background: #2a3942;

            border-radius: 21px;

            display: flex;
            align-items: center;

            padding: 0 15px;
        }

        #messageInput {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            color: #e9edef;

            font-size: 15px;

            resize: none;

            max-height: 110px;

            min-height: 22px;

            font-family: Arial, Helvetica, sans-serif;
        }

        #messageInput::placeholder {
            color: #8696a0;
        }

        .send-btn {
            flex-shrink: 0;

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background: #00a884;

            color: white;

            font-size: 20px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #06b994;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================================
           ERROR / SUCCESS MESSAGE
        ===================================================== */

        .send-error {
            position: fixed;

            bottom: 78px;
            left: 50%;

            transform: translateX(-50%);

            background: #ef5350;

            color: white;

            padding: 9px 15px;

            border-radius: 8px;

            font-size: 13px;

            display: none;

            z-index: 100;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .chat-header {
                height: 58px;
                min-height: 58px;
            }

            .messages-area {
                padding-left: 10px;
                padding-right: 10px;
            }

            .message-bubble {
                max-width: 82%;
            }

            .message-image {
                max-width: 240px;
                max-height: 280px;
            }

            .composer {
                padding: 7px;
            }
        }

    </style>
</head>


<body>

<div class="chat-app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="chat-header">

        <button
            class="back-btn"
            onclick="window.location.href='{{ url_for('messages') }}'">
            ‹
        </button>


        {% if user["profile_picture"] %}

            <img
                class="profile-photo"
                src="{{ url_for('static', filename='uploads/' ~ user['profile_picture']) }}"
                alt="Profile">

        {% else %}

            <div class="default-avatar">
                {{ user["name"][0]|upper }}
            </div>

        {% endif %}


        <div class="user-info">

            <div class="user-name">
                {{ user["name"] }}
            </div>

            <div
                id="onlineStatus"
                class="online-status">
                Offline
            </div>

        </div>

    </div>


    <!-- =====================================================
         MESSAGES
    ====================================================== -->

    <div
        id="messagesArea"
        class="messages-area">

        <div
            id="emptyChat"
            class="empty-chat"
            style="display:none;">
            No messages yet.<br>
            Send a message to start the conversation.
        </div>

    </div>


    <!-- =====================================================
         IMAGE PREVIEW
    ====================================================== -->

    <div
        id="imagePreviewContainer"
        class="image-preview-container">

        <div class="preview-wrapper">

            <img
                id="imagePreview"
                src=""
                alt="Selected image">

            <button
                type="button"
                class="remove-preview"
                onclick="removeSelectedImage()">
                ×
            </button>

        </div>

    </div>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->

    <div class="composer">

        <!-- IMAGE BUTTON -->

        <button
            type="button"
            class="attach-btn"
            onclick="document.getElementById('imageInput').click()"
            title="Send image">

            📎

        </button>


        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/gif,image/webp">


        <!-- MESSAGE INPUT -->

        <div class="input-container">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Type a message"></textarea>

        </div>


        <!-- SEND -->

        <button
            type="button"
            id="sendBtn"
            class="send-btn"
            onclick="sendMessage()">

            ➤

        </button>

    </div>

</div>


<div
    id="sendError"
    class="send-error">
</div>


<script>

    /* =====================================================
       USER INFORMATION
    ====================================================== */

    const OTHER_USER_ID = {{ user["id"] }};
    const CURRENT_USER_ID = {{ session["user_id"] }};


    let selectedImage = null;
    let firstLoad = true;


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const messagesArea =
        document.getElementById("messagesArea");

    const messageInput =
        document.getElementById("messageInput");

    const imageInput =
        document.getElementById("imageInput");

    const imagePreviewContainer =
        document.getElementById("imagePreviewContainer");

    const imagePreview =
        document.getElementById("imagePreview");

    const sendBtn =
        document.getElementById("sendBtn");

    const onlineStatus =
        document.getElementById("onlineStatus");

    const emptyChat =
        document.getElementById("emptyChat");

    const sendError =
        document.getElementById("sendError");


    /* =====================================================
       FORMAT TIME
    ====================================================== */

    function formatTime(dateString) {

        if (!dateString) {
            return "";
        }

        const date =
            new Date(
                dateString.replace(" ", "T")
            );

        if (isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
    }


    /* =====================================================
       SHOW ERROR
    ====================================================== */

    function showError(message) {

        sendError.textContent = message;

        sendError.style.display = "block";

        setTimeout(() => {
            sendError.style.display = "none";
        }, 3500);
    }


    /* =====================================================
       IMAGE URL
    ====================================================== */

    function getImageUrl(filename) {

        if (!filename) {
            return "";
        }

        return "/static/uploads/" +
               encodeURIComponent(filename);
    }


    /* =====================================================
       ESCAPE TEXT
    ====================================================== */

    function escapeHtml(text) {

        if (!text) {
            return "";
        }

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =====================================================
       RENDER MESSAGE
    ====================================================== */

    function createMessage(message) {

        const isSent =
            Number(message.sender_id) ===
            Number(CURRENT_USER_ID);

        const row =
            document.createElement("div");

        row.className =
            "message-row " +
            (isSent ? "sent" : "received");


        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";


        /*
           IMAGE
        */

        if (message.image) {

            bubble.classList.add("image-only");

            const image =
                document.createElement("img");

            image.className =
                "message-image";

            image.src =
                getImageUrl(message.image);

            image.alt =
                "Image";

            image.loading =
                "lazy";

            image.onclick = function() {

                window.open(
                    image.src,
                    "_blank"
                );

            };

            bubble.appendChild(image);
        }


        /*
           TEXT
        */

        if (message.message) {

            bubble.classList.remove("image-only");

            const text =
                document.createElement("div");

            text.className =
                "message-text";

            text.innerHTML =
                escapeHtml(message.message);

            bubble.appendChild(text);
        }


        /*
           FOOTER
        */

        const footer =
            document.createElement("div");

        footer.className =
            "message-footer";


        const time =
            document.createElement("span");

        time.className =
            "message-time";

        time.textContent =
            formatTime(message.created_at);


        footer.appendChild(time);


        /*
           TICKS FOR SENT MESSAGE
        */

        if (isSent) {

            const ticks =
                document.createElement("span");

            ticks.className =
                "ticks";

            if (message.read_at) {

                ticks.classList.add("seen");

                ticks.textContent =
                    "✓✓";

            } else if (message.delivered_at) {

                ticks.textContent =
                    "✓✓";

            } else {

                ticks.textContent =
                    "✓";

            }

            footer.appendChild(ticks);
        }


        bubble.appendChild(footer);


        /*
           UNSEND
        */

        if (isSent) {

            const unsend =
                document.createElement("button");

            unsend.className =
                "unsend-btn";

            unsend.type =
                "button";

            unsend.textContent =
                "Unsend";

            unsend.onclick =
                function(event) {

                    event.stopPropagation();

                    unsendMessage(
                        message.id
                    );
                };

            bubble.appendChild(unsend);
        }


        row.appendChild(bubble);

        return row;
    }


    /* =====================================================
       LOAD MESSAGES
    ====================================================== */

    async function loadMessages() {

        try {

            const response =
                await fetch(
                    `/messages/${OTHER_USER_ID}/data`,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            const responseText =
                await response.text();


            let data;

            try {

                data =
                    JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "SERVER RESPONSE:",
                    response.status,
                    responseText
                );

                return;
            }


            if (!response.ok ||
                !data.success) {

                console.error(
                    "Message loading failed:",
                    data.error
                );

                return;
            }


            /* =================================================
               ONLINE STATUS
            ================================================= */

            if (data.user &&
                data.user.online) {

                onlineStatus.textContent =
                    "Online";

                onlineStatus.classList.add(
                    "online"
                );

            } else {

                onlineStatus.textContent =
                    "Offline";

                onlineStatus.classList.remove(
                    "online"
                );
            }


            /* =================================================
               MESSAGES
            ================================================= */

            const messages =
                data.messages || [];


            const oldScrollHeight =
                messagesArea.scrollHeight;

            const oldScrollTop =
                messagesArea.scrollTop;

            const oldClientHeight =
                messagesArea.clientHeight;


            messagesArea.innerHTML = "";


            if (messages.length === 0) {

                emptyChat.style.display =
                    "flex";

                messagesArea.appendChild(
                    emptyChat
                );

            } else {

                emptyChat.style.display =
                    "none";

                messages.forEach(message => {

                    messagesArea.appendChild(
                        createMessage(message)
                    );

                });
            }


            /*
               Scroll to bottom only when:
               - first loading
               - user was already near bottom
            */

            const nearBottom =
                oldScrollHeight -
                oldScrollTop -
                oldClientHeight <
                150;


            if (firstLoad || nearBottom) {

                messagesArea.scrollTop =
                    messagesArea.scrollHeight;
            }


            firstLoad = false;


        } catch (error) {

            console.error(
                "LOAD MESSAGES ERROR:",
                error
            );
        }
    }


    /* =====================================================
       SEND MESSAGE
    ====================================================== */

    async function sendMessage() {

        const text =
            messageInput.value.trim();


        if (!text && !selectedImage) {

            return;
        }


        sendBtn.disabled = true;


        try {

            const formData =
                new FormData();


            if (text) {

                formData.append(
                    "message",
                    text
                );
            }


            if (selectedImage) {

                formData.append(
                    "image",
                    selectedImage
                );
            }


            const response =
                await fetch(
                    `/messages/${OTHER_USER_ID}`,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const responseText =
                await response.text();


            let data;

            try {

                data =
                    JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "SEND SERVER RESPONSE:",
                    response.status,
                    responseText
                );

                showError(
                    "Server error. Check Flask terminal."
                );

                return;
            }


            if (!response.ok ||
                !data.success) {

                showError(
                    data.error ||
                    "Message could not be sent."
                );

                return;
            }


            /*
               Clear input
            */

            messageInput.value = "";

            messageInput.style.height =
                "22px";


            removeSelectedImage();


            /*
               Immediately reload chat
            */

            await loadMessages();


            /*
               Scroll bottom
            */

            messagesArea.scrollTop =
                messagesArea.scrollHeight;


        } catch (error) {

            console.error(
                "SEND MESSAGE ERROR:",
                error
            );

            showError(
                "Unable to send message."
            );

        } finally {

            sendBtn.disabled = false;
        }
    }


    /* =====================================================
       IMAGE SELECTION
    ====================================================== */

    imageInput.addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (!file) {

                removeSelectedImage();

                return;
            }


            if (!file.type.startsWith("image/")) {

                showError(
                    "Please select an image file."
                );

                this.value = "";

                return;
            }


            /*
               Maximum 50 MB
            */

            if (file.size > 50 * 1024 * 1024) {

                showError(
                    "Image must be smaller than 50 MB."
                );

                this.value = "";

                return;
            }


            selectedImage =
                file;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    imagePreview.src =
                        event.target.result;

                    imagePreviewContainer.style.display =
                        "block";
                };


            reader.readAsDataURL(file);
        }
    );


    /* =====================================================
       REMOVE IMAGE
    ====================================================== */

    function removeSelectedImage() {

        selectedImage =
            null;

        imageInput.value =
            "";

        imagePreview.src =
            "";

        imagePreviewContainer.style.display =
            "none";
    }


    /* =====================================================
       UNSEND
    ====================================================== */

    async function unsendMessage(messageId) {

        try {

            const response =
                await fetch(
                    `/messages/unsend/${messageId}`,
                    {
                        method: "POST"
                    }
                );


            const responseText =
                await response.text();


            let data;

            try {

                data =
                    JSON.parse(responseText);

            } catch {

                showError(
                    "Unable to unsend message."
                );

                return;
            }


            if (!response.ok ||
                !data.success) {

                showError(
                    data.error ||
                    "Unable to unsend message."
                );

                return;
            }


            await loadMessages();

        } catch (error) {

            console.error(
                "UNSEND ERROR:",
                error
            );

            showError(
                "Unable to unsend message."
            );
        }
    }


    /* =====================================================
       ENTER TO SEND
    ====================================================== */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    /* =====================================================
       AUTO RESIZE TEXTAREA
    ====================================================== */

    messageInput.addEventListener(
        "input",
        function() {

            this.style.height =
                "22px";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    110
                ) + "px";
        }
    );


    /* =====================================================
       HEARTBEAT
    ====================================================== */

    async function heartbeat() {

        try {

            await fetch(
                "/heartbeat",
                {
                    method: "POST"
                }
            );

        } catch (error) {

            console.log(
                "Heartbeat error"
            );
        }
    }


    /* =====================================================
       START
    ====================================================== */

    loadMessages();

    heartbeat();


    /*
       Refresh messages every 2 seconds.
       This gives near-real-time chat behaviour.
    */

    setInterval(
        loadMessages,
        2000
    );


    /*
       Update own online status.
    */

    setInterval(
        heartbeat,
        5000
    );


    /*
       Mark messages as read.
    */

    fetch(
