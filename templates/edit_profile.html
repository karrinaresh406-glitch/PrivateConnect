<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - PrivateConnect</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #1877f2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d65d9;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Edit Profile</h1>

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ person['name'] }}"
            required
        >

        <br><br>

        <label>Bio</label>

        <textarea
            name="bio"
            placeholder="Write something about yourself..."
        >{{ person['bio'] or '' }}</textarea>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <a
        class="cancel"
        href="{{ url_for('profile') }}"
    >
        Cancel
    </a>

</div>

</body>
</html>
