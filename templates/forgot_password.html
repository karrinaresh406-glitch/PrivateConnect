<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - PrivateConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #071426;
            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 400px;

            background: #0d1d32;

            padding: 30px;

            border-radius: 18px;

            border: 1px solid #193858;

            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: bold;

            color: #4da3ff;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #9fb2c8;

            font-size: 14px;

            margin-bottom: 28px;
        }

        h2 {
            text-align: center;

            margin-bottom: 15px;
        }

        .description {
            text-align: center;

            color: #9fb2c8;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            color: #dce8f5;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 10px;

            border: 1px solid #294766;

            background: #08172a;

            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #238cff;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #238cff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1478df;
        }

        .message {
            margin-top: 18px;

            padding: 12px;

            border-radius: 10px;

            background: #102b45;

            color: #9fd0ff;

            text-align: center;

            font-size: 14px;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #4da3ff;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <div class="logo">
            PrivateConnect
        </div>

        <div class="subtitle">
            Connect privately. Connect better.
        </div>

        <h2>Forgot Password?</h2>

        <p class="description">
            Enter your registered email address to continue.
        </p>

        <form method="POST">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Continue
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <a
            href="{{ url_for('login') }}"
            class="back-link"
        >
            ← Back to Login
        </a>

    </div>

</body>
</html>
