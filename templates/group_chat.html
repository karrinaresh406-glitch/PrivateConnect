<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ group["name"] }} - PrivateConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 25px;
            margin-right: 15px;
        }

        .group-info h2 {
            font-size: 18px;
        }

        .group-info p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat {
            padding: 75px 12px 80px;
            max-width: 700px;
            margin: auto;
        }

        .message {
            display: flex;
            margin-bottom: 10px;
        }

        .message.mine {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 10px 13px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .mine .bubble {
            background: #1877f2;
            color: white;
        }

        .sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #1877f2;
        }

        .mine .sender {
            display: none;
        }

        .text {
            font-size: 15px;
            word-wrap: break-word;
        }

        .time {
            font-size: 10px;
            opacity: 0.65;
            margin-top: 5px;
            text-align: right;
        }

        .composer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #ddd;
            padding: 10px;
            z-index: 1000;
        }

        .composer form {
            max-width: 700px;
            margin: auto;
            display: flex;
            gap: 8px;
        }

        .composer input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .composer button {
            width: 50px;
            border: none;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 100px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <a href="{{ url_for('groups') }}" class="back">
            ←
        </a>

        <div class="group-info">

            <h2>{{ group["name"] }}</h2>

            <p>
                {{ group["description"] or "Group chat" }}
            </p>

        </div>

    </div>


    <!-- CHAT -->

    <div class="chat">

        {% if messages %}

            {% for msg in messages %}

                <div class="message
                    {% if msg['sender_id'] == session['user_id'] %}
                        mine
                    {% endif %}
                ">

                    <div class="bubble">

                        <div class="sender">
                            {{ msg["sender_name"] }}
                        </div>

                        <div class="text">
                            {{ msg["message"] }}
                        </div>

                        <div class="time">
                            {{ msg["created_at"] }}
                        </div>

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty">
                <h3>No messages yet 👋</h3>
                <p>Send the first message!</p>
            </div>

        {% endif %}

    </div>


    <!-- MESSAGE COMPOSER -->

    <div class="composer">

        <form method="POST"
              action="{{ url_for('send_group_message', group_id=group['id']) }}">

            <input
                type="text"
                name="message"
                placeholder="Type a message..."
                maxlength="1000"
                autocomplete="off"
                required
            >

            <button type="submit">
                ➤
            </button>

        </form>

    </div>

</body>

</html>
