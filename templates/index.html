<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reels - PrivateConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            background: rgba(0,0,0,0.75);

            z-index: 100;
        }

        .header h2 {
            font-size: 20px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 25px;
        }

        /* REELS */

        .reels-container {
            width: 100%;
            max-width: 600px;

            margin: auto;

            padding-top: 60px;
        }

        .reel {
            position: relative;

            width: 100%;

            height: calc(100vh - 60px);

            overflow: hidden;

            border-bottom: 1px solid #333;

            background: #111;
        }

        .reel video {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* USER INFO */

        .reel-info {
            position: absolute;

            left: 15px;
            bottom: 30px;

            right: 80px;
        }

        .username {
            font-size: 17px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        .caption {
            font-size: 14px;
            line-height: 1.4;
        }

        /* ACTIONS */

        .actions {
            position: absolute;

            right: 15px;
            bottom: 35px;

            display: flex;
            flex-direction: column;

            gap: 22px;

            text-align: center;
        }

        .action {
            font-size: 25px;
            cursor: pointer;
        }

        .count {
            font-size: 12px;
            margin-top: 3px;
        }

        /* PLAY BUTTON */

        .play-button {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            font-size: 55px;

            display: none;

            pointer-events: none;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .reel {
                height: calc(100vh - 60px);
            }

        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <a href="/" class="back">
            ←
        </a>

        <h2>Reels</h2>

        <div>🔍</div>

    </div>


    <!-- REELS -->

    <div class="reels-container">

        <!-- REEL 1 -->

        <div class="reel">

            <video
                controls
                loop
                playsinline
            >
                <source
                    src="{{ url_for('static', filename='uploads/reel1.mp4') }}"
                    type="video/mp4"
                >
            </video>


            <div class="play-button">
                ▶
            </div>


            <div class="reel-info">

                <div class="username">
                    @PrivateConnect
                </div>

                <div class="caption">
                    Welcome to PrivateConnect 🎬
                </div>

            </div>


            <div class="actions">

                <div>
                    <div class="action">❤️</div>
                    <div class="count">0</div>
                </div>

                <div>
                    <div class="action">💬</div>
                    <div class="count">0</div>
                </div>

                <div>
                    <div class="action">↗️</div>
                    <div class="count">Share</div>
                </div>

            </div>

        </div>

    </div>


    <script>

        const videos =
            document.querySelectorAll(".reel video");


        videos.forEach(video => {

            video.addEventListener(
                "click",
                function() {

                    if (video.paused) {

                        video.play();

                    } else {

                        video.pause();

                    }

                }
            );

        });

    </script>

</body>

</html>
