<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - PrivateConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .profile-container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        .profile-picture {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ddd;
            margin-bottom: 20px;
        }

        .default-picture {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 60px;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .email {
            color: #666;
            margin-bottom: 25px;
        }

        .upload-form {
            margin: 20px 0;
        }

        input[type="file"] {
            margin-bottom: 15px;
            max-width: 100%;
        }

        button,
        .button {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }

        button:hover,
        .button:hover {
            background: #555;
        }

        .links {
            margin-top: 25px;
        }

    </style>

</head>

<body>

<div class="profile-container">

    <h1>Profile</h1>


    {% if person["profile_picture"] %}

        <img
            src="{{ url_for('static', filename='uploads/' + person['profile_picture']) }}"
            class="profile-picture"
            alt="Profile Picture"
        >

    {% else %}

        <div class="default-picture">
            👤
        </div>

    {% endif %}


    <div class="name">
        {{ person["name"] }}
    </div>

    <div class="email">
        {{ person["email"] }}
    </div>


    <form
        class="upload-form"
        action="{{ url_for('upload_profile_picture') }}"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="profile_picture"
            accept="image/*"
            required
        >

        <br>

        <button type="submit">
            📷 Upload Profile Picture
        </button>

    </form>


    <div class="links">

        <a
            href="{{ url_for('edit_profile') }}"
            class="button"
        >
            ✏️ Edit Profile
        </a>

        <a
            href="{{ url_for('find_people') }}"
            class="button"
        >
            👥 Find People
        </a>

        <a
            href="{{ url_for('dashboard') }}"
            class="button"
        >
            🏠 Dashboard
        </a>

    </div>

</div>

</body>
</html>
